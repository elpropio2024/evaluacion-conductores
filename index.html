<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evaluación de Conductores - Bus Huanghai DD6960B01NE</title>
<style>
  :root{
    --orange:#e8622c; --orange-dark:#c94f1f; --dark:#1c1f26; --gray:#5b6270;
    --bg:#f4f5f7; --card:#ffffff; --green:#1f8a4c; --red:#c53030; --border:#e2e4e9;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--dark);}
  .wrap{max-width:720px;margin:0 auto;padding:20px 16px 60px;}
  header{padding:22px 16px;background:linear-gradient(120deg,var(--dark),#2b3040);color:#fff;border-radius:14px;margin-bottom:18px;}
  header h1{margin:0 0 4px;font-size:1.3rem;}
  header p{margin:0;color:#c9cdd6;font-size:.88rem;}
  .card{background:var(--card);border-radius:14px;padding:20px;box-shadow:0 2px 10px rgba(0,0,0,.06);margin-bottom:16px;border:1px solid var(--border);}
  #setup label{display:block;font-size:.85rem;color:var(--gray);margin-bottom:6px;}
  #setup input{width:100%;padding:10px 12px;border-radius:8px;border:1px solid var(--border);font-size:1rem;margin-bottom:14px;}
  #setup .hint{font-size:.75rem;color:#9aa0ab;margin:-10px 0 14px;}
  button{cursor:pointer;border:none;border-radius:9px;font-weight:600;font-size:.95rem;padding:12px 18px;}
  .btn-primary{background:var(--orange);color:#fff;}
  .btn-primary:hover{background:var(--orange-dark);}
  .btn-secondary{background:#eceef2;color:var(--dark);}
  .btn-row{display:flex;gap:10px;justify-content:space-between;margin-top:14px;}
  .progress-outer{height:8px;background:#eceef2;border-radius:6px;overflow:hidden;margin-bottom:16px;}
  .progress-inner{height:100%;background:var(--orange);width:0%;transition:width .25s;}
  .qcount{font-size:.8rem;color:var(--gray);margin-bottom:6px;font-weight:600;letter-spacing:.02em;}
  .qtext{font-size:1.05rem;font-weight:600;line-height:1.4;margin-bottom:14px;}
  .qimg{width:100%;border-radius:10px;margin-bottom:14px;border:1px solid var(--border);display:block;}
  .opt{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1.5px solid var(--border);border-radius:10px;margin-bottom:10px;cursor:pointer;transition:.15s;}
  .opt:hover{border-color:var(--orange);}
  .opt.selected{border-color:var(--orange);background:#fff3ec;}
  .opt input{accent-color:var(--orange);width:18px;height:18px;flex-shrink:0;}
  .opt span{font-size:.95rem;}
  .result-score{text-align:center;padding:10px 0 4px;}
  .result-score .big{font-size:2.6rem;font-weight:800;color:var(--orange);}
  .result-score .sub{color:var(--gray);font-size:.95rem;}
  .rev-item{border-bottom:1px solid var(--border);padding:14px 0;}
  .rev-item:last-child{border-bottom:none;}
  .rev-q{font-weight:600;margin-bottom:6px;}
  .tag{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:20px;margin-right:6px;}
  .tag.ok{background:#e3f6e9;color:var(--green);}
  .tag.bad{background:#fde8e8;color:var(--red);}
  .rev-ans{font-size:.88rem;color:var(--gray);margin:3px 0;}
  .rev-exp{font-size:.85rem;color:#3a3f4a;background:#f7f8fa;padding:8px 10px;border-radius:8px;margin-top:6px;}
  .recbox{background:#fff3ec;border:1px solid #f3c9ac;border-radius:10px;padding:12px 14px;font-size:.9rem;margin-top:10px;}
  .notice{font-size:.78rem;color:#9aa0ab;margin-top:8px;text-align:center;}
  footer{text-align:center;color:#9aa0ab;font-size:.75rem;margin-top:10px;}
  @media print{
    button, #setup, .progress-outer, .notice{display:none;}
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Evaluación de Conductores</h1>
    <p>Bus Huanghai DD6960B01NE — Motor Yuchai a GNC · CCSI</p>
  </header>

  <div class="card" id="setup">
    <label for="nombre">Nombre del conductor evaluado</label>
    <input type="text" id="nombre" placeholder="Escriba el nombre completo">

    <label for="cedula">Número de cédula (sin puntos)</label>
    <input type="text" id="cedula" placeholder="Ej: 1234567890" inputmode="numeric">
    <div class="hint">Solo números, sin puntos ni espacios.</div>

    <label for="correo">Correo electrónico del conductor</label>
    <input type="email" id="correo" placeholder="nombre@correo.com">

    <button class="btn-primary" style="width:100%" onclick="startQuiz()">Iniciar evaluación (20 preguntas)</button>
  </div>

  <div class="card" id="quizArea" style="display:none">
    <div class="progress-outer"><div class="progress-inner" id="progressBar"></div></div>
    <div class="qcount" id="qcount"></div>
    <div id="qimgHolder"></div>
    <div class="qtext" id="qtext"></div>
    <div id="optsHolder"></div>
    <div class="btn-row">
      <button class="btn-secondary" id="btnPrev" onclick="prevQ()">Anterior</button>
      <button class="btn-primary" id="btnNext" onclick="nextQ()">Siguiente</button>
    </div>
  </div>

  <div class="card" id="resultArea" style="display:none">
    <div class="result-score">
      <div class="big" id="scoreBig">0/20</div>
      <div class="sub" id="scoreSub"></div>
      <div class="sub" id="scoreWho" style="margin-top:6px;font-weight:600;color:var(--dark)"></div>
    </div>
    <div class="recbox" id="recBox"></div>
    <div class="btn-row">
      <button class="btn-primary" style="width:100%" onclick="guardarResultado()">Guardar resultado en el sistema</button>
    </div>
    <p id="saveStatus" style="text-align:center;color:var(--gray);font-size:.85rem;margin-top:8px;">Se abrirá el formulario para guardar...</p>
    <div class="btn-row">
      <button class="btn-secondary" style="width:100%" onclick="window.print()">Imprimir / Guardar resultado</button>
    </div>
  </div>

  <footer>Material de capacitación interna — CCSI · Basado en el manual del fabricante Huanghai DD6960B01NE.</footer>
</div>

<script>
const QUESTIONS = [{"img": null, "q": "¿Cuál es la marca del bus (chasis) que se evalúa en esta capacitación?", "opts": ["Yutong", "Huanghai", "Volvo", "Foton"], "correct": 1, "exp": "El vehículo es un Huanghai, modelo DD6960B01NE."}, {"img": null, "q": "¿Cuál es la marca del motor de este vehículo?", "opts": ["Cummins", "Yuchai", "Deutz", "Weichai"], "correct": 1, "exp": "El motor es un Yuchai modelo YCA07260N-60."}, {"img": null, "q": "¿Qué combustible utiliza el motor de este bus?", "opts": ["ACPM (diésel)", "Gasolina", "Gas Natural Comprimido (GNC)", "Eléctrico (batería)"], "correct": 2, "exp": "Es un motor de gas natural vertical, en línea, turboalimentado y controlado electrónicamente."}, {"img": null, "q": "¿Cuántas correas tiene el sistema de ventiladores de refrigeración del radiador (lado derecho)?", "opts": ["1 correa", "2 correas", "Ninguna: los ventiladores son eléctricos y no llevan correa", "4 correas"], "correct": 2, "exp": "El sistema de refrigeración usa varios motoventiladores eléctricos; no existe una correa que los accione."}, {"img": null, "q": "¿Cuál es la marca de la caja de cambios (transmisión automática)?", "opts": ["ZF", "Allison", "Xi'an Shuangte", "Voith"], "correct": 2, "exp": "La transmisión automática hidráulica (modelo FC6A145R) es de la marca Xi'an Shuangte."}, {"img": "psc", "q": "Observe la fotografía. Durante el encendido del vehículo, ¿qué botón se debe presionar para que se cargue el consumo de gas en el medidor del tablero?", "opts": ["ASR OFF", "HSA", "Diagnóstico del motor", "PSC"], "correct": 3, "exp": "Se debe presionar el botón PSC para el cargue de gas en el medidor del tablero."}, {"img": null, "q": "Durante el tanqueo de GNC, ¿cuáles válvulas se deben abrir para permitir el flujo de gas hacia los cilindros?", "opts": ["Válvulas K2", "Válvulas de purga", "Válvulas K1", "Válvulas del intercooler"], "correct": 2, "exp": "Se deben abrir las válvulas K1 (ubicadas en los cilindros) mientras se realiza el llenado."}, {"img": null, "q": "Inmediatamente después de terminar el tanqueo, ¿qué se debe hacer con las válvulas K1?", "opts": ["Dejarlas abiertas indefinidamente", "Cerrarlas antes de restaurar la energía o encender el motor", "Retirarlas del vehículo", "Abrirlas al máximo"], "correct": 1, "exp": "Se deben cerrar estrictamente las válvulas K1 antes de restaurar la energía o encender el motor."}, {"img": null, "q": "Antes de iniciar el tanqueo de GNC, ¿qué se debe hacer con el motor y los equipos eléctricos?", "opts": ["Dejar el motor en ralentí", "Apagar el motor, desconectar los equipos eléctricos y cortar la energía desde el interruptor principal", "Solo apagar las luces interiores", "No se requiere ninguna preparación"], "correct": 1, "exp": "Fase de preparación: apagar el motor por completo, desconectar todos los equipos eléctricos y cortar la energía desde el interruptor principal (baterías)."}, {"img": null, "q": "Antes de que el motor pueda arrancar, ¿en qué posición debe estar obligatoriamente el selector de marchas?", "opts": ["D (Marcha adelante)", "R (Reversa)", "N (Neutro)", "Cualquier posición"], "correct": 2, "exp": "El motor no enciende si la transmisión no está en posición N (Neutro)."}, {"img": null, "q": "¿Dónde está ubicado el depósito de líquido de frenos de este vehículo?", "opts": ["En la compuerta delantera izquierda", "En la compuerta trasera derecha", "No existe: el sistema de frenos de este bus es neumático (de aire comprimido), no hidráulico", "Debajo del tablero de instrumentos"], "correct": 2, "exp": "Este bus utiliza freno de servicio neumático (por aire comprimido); no tiene un depósito de líquido de frenos como los sistemas hidráulicos."}, {"img": null, "q": "Si el conductor manipula el selector de marchas sin cumplir las condiciones requeridas (por ejemplo, cambiar de D a R sin que el vehículo esté detenido), ¿qué hace el sistema?", "opts": ["La caja se daña permanentemente de inmediato", "El sistema bloquea el cambio seleccionado como protección de la caja (la letra N parpadea)", "El vehículo acelera de forma automática", "No ocurre ninguna reacción del sistema"], "correct": 1, "exp": "Si la letra N parpadea en el indicador, el sistema está protegiendo la caja y ha bloqueado el cambio seleccionado; por eso una mala manipulación del teclado 'neutraliza' el cambio."}, {"img": null, "q": "¿Qué testigo del tablero indica que una puerta está abierta y que por lo tanto NO se debe iniciar la marcha?", "opts": ["Testigo de neutro", "Testigo de apertura de puertas", "Testigo ASR", "Testigo de retardador activo"], "correct": 1, "exp": "El testigo de apertura de puertas indica puerta abierta; no se debe iniciar marcha con este testigo encendido."}, {"img": "switches", "q": "Observe la fotografía de los interruptores. ¿Para qué sirve el interruptor de color rojo con el ícono de un grifo/llave?", "opts": ["Interruptor del desempañador", "Interruptor de la bomba de agua de la calefacción", "Interruptor de calefacción de los espejos retrovisores", "Interruptor de la bomba extintora"], "correct": 1, "exp": "Ese interruptor rojo corresponde a la bomba de agua de la calefacción."}, {"img": "switches", "q": "En la misma fotografía, ¿para qué sirve el interruptor de color naranja con líneas onduladas?", "opts": ["Interruptor de la bomba de agua de la calefacción", "Interruptor del desempañador", "Interruptor de nivelación de los faros delanteros", "Interruptor de la bomba extintora"], "correct": 1, "exp": "Ese interruptor naranja corresponde al desempañador (parabrisas)."}, {"img": null, "q": "Después de detener completamente el bus, ¿cuánto tiempo se recomienda dejar el motor en ralentí antes de apagarlo?", "opts": ["Apagarlo de inmediato", "3 a 5 minutos", "20 minutos", "1 hora"], "correct": 1, "exp": "Se debe dejar el motor en ralentí entre 3 y 5 minutos antes de apagarlo."}, {"img": null, "q": "¿Por qué NO se debe apagar el motor inmediatamente después de detener el vehículo?", "opts": ["Porque consume más gas", "Porque puede dañar el motor, especialmente el turbocompresor, al no permitir su correcto enfriamiento y lubricación", "Porque se dañan los frenos neumáticos", "Porque se descarga la batería de inmediato"], "correct": 1, "exp": "Apagar el motor de golpe puede dañar el turbocompresor, ya que no se le da tiempo a enfriarse y lubricarse adecuadamente."}, {"img": "dash", "q": "Observe la fotografía del tablero de instrumentos. El ícono rojo con forma de aceitera (parte inferior izquierda del clúster) representa:", "opts": ["Testigo de baja presión de aceite", "Testigo de batería", "Testigo de neutro", "Testigo de puerta abierta"], "correct": 0, "exp": "Ese ícono en rojo es el testigo de baja presión de aceite del motor."}, {"img": "dash", "q": "En la misma fotografía del tablero, el reloj circular derecho con escala 40-80-120 representa:", "opts": ["Presión de aire de los frenos", "Temperatura del refrigerante del motor", "Nivel de gas natural comprimido", "Revoluciones del motor (tacómetro)"], "correct": 1, "exp": "Esa escala corresponde a la temperatura del refrigerante del motor (rango normal aproximado 75-100°C)."}, {"img": null, "q": "¿Cuántos litros de ACPM (diésel) lleva el tanque de combustible de este vehículo?", "opts": ["200 litros", "300 litros", "150 litros", "No aplica: este vehículo funciona con Gas Natural Comprimido (GNC), no usa ACPM"], "correct": 3, "exp": "El vehículo funciona con GNC, por lo tanto no tiene tanque de ACPM."}];

let current = 0;
let answers = new Array(QUESTIONS.length).fill(null);
let driverInfo = {nombre:'', cedula:'', correo:'', fecha:''};
let finalScore = 0, finalPct = 0, finalRec = '';

function startQuiz(){
  const nombre = document.getElementById('nombre').value.trim();
  const cedula = document.getElementById('cedula').value.trim();
  const correo = document.getElementById('correo').value.trim();
  const hoy = new Date();
  const fecha = hoy.getFullYear()+'-'+String(hoy.getMonth()+1).padStart(2,'0')+'-'+String(hoy.getDate()).padStart(2,'0');

  if(!nombre){ alert('Escriba el nombre del conductor.'); return; }
  if(!/^[0-9]{5,15}$/.test(cedula)){ alert('La cédula debe contener solo números, sin puntos ni espacios.'); return; }
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(correo)){ alert('Escriba un correo electrónico válido.'); return; }

  driverInfo = {nombre, cedula, correo, fecha};
  document.getElementById('setup').style.display='none';
  document.getElementById('quizArea').style.display='block';
  renderQ();
}

function renderQ(){
  const q = QUESTIONS[current];
  document.getElementById('progressBar').style.width = ((current)/(QUESTIONS.length)*100)+'%';
  document.getElementById('qcount').textContent = 'Pregunta '+(current+1)+' de '+QUESTIONS.length;
  document.getElementById('qtext').textContent = q.q;
  const imgHolder = document.getElementById('qimgHolder');
  imgHolder.innerHTML = '';
  if(q.img){
    const img = document.createElement('img');
    img.src = IMAGES[q.img];
    img.className = 'qimg';
    imgHolder.appendChild(img);
  }
  const optsHolder = document.getElementById('optsHolder');
  optsHolder.innerHTML = '';
  q.opts.forEach((opt, idx)=>{
    const div = document.createElement('div');
    div.className = 'opt' + (answers[current]===idx ? ' selected' : '');
    div.onclick = ()=>selectOpt(idx);
    div.innerHTML = '<input type="radio" name="opt" '+(answers[current]===idx?'checked':'')+' readonly> <span>'+opt+'</span>';
    optsHolder.appendChild(div);
  });
  document.getElementById('btnPrev').style.visibility = current===0 ? 'hidden':'visible';
  document.getElementById('btnNext').textContent = current===QUESTIONS.length-1 ? 'Finalizar' : 'Siguiente';
}

function selectOpt(idx){
  answers[current]=idx;
  renderQ();
}

function prevQ(){
  if(current>0){ current--; renderQ(); }
}

function nextQ(){
  if(answers[current]===null){
    alert('Seleccione una respuesta antes de continuar.');
    return;
  }
  if(current < QUESTIONS.length-1){
    current++;
    renderQ();
  } else {
    finishQuiz();
  }
}

function buildRecommendation(pct){
  if(pct>=90) return "Excelente dominio del procedimiento operativo. Apto para operar el vehículo sin observaciones.";
  if(pct>=70) return "Nivel aceptable. Se recomienda reforzar los temas donde falló antes de operar el vehículo sin acompañamiento.";
  if(pct>=50) return "Nivel bajo. Requiere capacitación adicional y acompañamiento antes de operar el vehículo.";
  return "No aprobado. No se recomienda asignar el vehículo hasta repetir la capacitación y presentar de nuevo la evaluación.";
}

function finishQuiz(){
  document.getElementById('quizArea').style.display='none';
  let score=0;
  QUESTIONS.forEach((q,i)=>{ if(answers[i]===q.correct) score++; });
  finalScore = score;
  finalPct = Math.round(score/QUESTIONS.length*100);
  finalRec = buildRecommendation(finalPct);

  document.getElementById('scoreBig').textContent = score+'/'+QUESTIONS.length;
  document.getElementById('scoreSub').textContent = finalPct+'% de respuestas correctas';
  document.getElementById('scoreWho').textContent = driverInfo.nombre + ' · CC '+driverInfo.cedula + (driverInfo.fecha? ' · '+driverInfo.fecha : '');
  document.getElementById('recBox').innerHTML = '<strong>Recomendación:</strong> '+finalRec;
  document.getElementById('resultArea').style.display='block';

  // Construir objeto de datos para Formspree
  const respuestasDetalle = {};
  for (let i = 1; i <= 20; i++) {
    const respuesta = answers[i-1];
    if (respuesta !== null) {
      respuestasDetalle["P" + i] = QUESTIONS[i-1].opts[respuesta];
    }
  }
  
  datosExamen = {
    Nombre: driverInfo.nombre,
    Cedula: driverInfo.cedula,
    Correo: driverInfo.correo,
    Fecha: driverInfo.fecha || "",
    Hora: new Date().toLocaleTimeString(),
    Puntaje: finalScore + "/20",
    Porcentaje: finalPct + "%",
    Preguntas_Buenas: buenasList.join(", "),
    Preguntas_Malas: malasList.join(", "),
    Recomendacion: finalRec,
    ...respuestasDetalle
  };
