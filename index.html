<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evaluación de Conductores - Bus Huanghai</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { 
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.card { 
  background: white; 
  border-radius: 12px; 
  padding: 40px; 
  max-width: 700px; 
  width: 100%;
  box-shadow: 0 10px 40px rgba(0,0,0,0.1);
}
.header {
  background: #2c3e50;
  color: white;
  padding: 20px;
  border-radius: 12px;
  margin-bottom: 30px;
}
.header h1 { font-size: 24px; margin-bottom: 5px; }
.header p { font-size: 13px; opacity: 0.9; }
.form-group { margin-bottom: 20px; }
label { display: block; color: #555; font-size: 14px; margin-bottom: 8px; font-weight: 600; }
input { 
  width: 100%; 
  padding: 12px; 
  border: 1px solid #ddd; 
  border-radius: 6px;
  font-size: 14px;
}
input:focus { outline: none; border-color: #ff6b35; }
.btn {
  width: 100%;
  padding: 14px;
  background: #ff6b35;
  color: white;
  border: none;
  border-radius: 6px;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
}
.btn:hover { background: #e55a2b; }
.question { display: none; padding: 20px; background: #f9f9f9; border-radius: 8px; margin-bottom: 20px; }
.question.active { display: block; }
.progress { 
  width: 100%; 
  height: 4px; 
  background: #eee; 
  border-radius: 4px; 
  margin-bottom: 20px;
  overflow: hidden;
}
.progress-bar { 
  height: 100%; 
  background: #ff6b35; 
  width: 0%; 
}
.q-title { font-weight: 600; margin-bottom: 15px; }
.options label { 
  display: block; 
  margin: 10px 0; 
  cursor: pointer;
  padding: 10px;
  border-radius: 4px;
}
.options label:hover { background: #f0f0f0; }
.result {
  display: none;
  text-align: center;
  padding: 30px;
}
.result.show { display: block; }
.score { font-size: 48px; color: #ff6b35; font-weight: bold; margin: 20px 0; }
.recommendation { 
  padding: 15px; 
  background: #fff3cd; 
  border-radius: 6px;
  margin: 20px 0;
}
.footer { color: #999; font-size: 12px; text-align: center; margin-top: 30px; }
</style>
</head>
<body>

<div class="card">
  <div class="header">
    <h1>Evaluación de Conductores</h1>
    <p>Bus Huanghai DD6960B01NE — Motor Yuchai a GNC · CCSI</p>
  </div>

  <!-- Formulario inicial -->
  <div id="formArea">
    <div class="form-group">
      <label>Nombre del conductor evaluado</label>
      <input type="text" id="nombre" placeholder="Escriba el nombre completo">
    </div>
    <div class="form-group">
      <label>Número de cédula (sin puntos)</label>
      <input type="text" id="cedula" placeholder="Ej: 1234567890">
      <small style="color:#999;">Solo números, sin puntos ni espacios.</small>
    </div>
    <div class="form-group">
      <label>Correo electrónico del conductor</label>
      <input type="email" id="correo" placeholder="nombre@correo.com">
    </div>
    <button class="btn" onclick="startQuiz()">Iniciar evaluación (20 preguntas)</button>
  </div>

  <!-- Preguntas -->
  <div id="quizArea" style="display:none;">
    <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
    <div id="questionContainer"></div>
    <div style="text-align:center; margin-top:20px;">
      <button class="btn" onclick="nextQuestion()" id="nextBtn">Siguiente →</button>
    </div>
  </div>

  <!-- Resultados -->
  <div id="resultArea" class="result">
    <div class="score" id="scoreDisplay">0/20</div>
    <div id="percentDisplay">0%</div>
    <div id="userInfo"></div>
    <div class="recommendation" id="recDisplay"></div>
    <button class="btn" onclick="saveToGoogle()" style="margin-top:20px;">Guardar resultado en el sistema</button>
    <button onclick="location.reload()" class="btn" style="background:#999; margin-top:10px;">Volver a empezar</button>
  </div>

  <div class="footer">
    Material de capacitación interna — CCSI · Basado en el manual del fabricante Huanghai DD6960B01NE.
  </div>
</div>

<script>
const QUESTIONS = [
  {q: "¿Cuál es la marca del bus (chasis) que se evalúa en esta capacitación?", opts: ["Volvo", "Huanghai", "MAN", "Scania"], correct: 1},
  {q: "¿Cuál es la marca del motor de este vehículo?", opts: ["Cummins", "Yuchai", "Deutz", "Perkins"], correct: 1},
  {q: "¿Qué combustible utiliza el motor de este bus?", opts: ["Gasolina", "ACPM (Diesel)", "Gas Natural Comprimido (GNC)", "Híbrido"], correct: 2},
  {q: "¿Los ventiladores del radiador funcionan con correa o son eléctricos?", opts: ["Ventiladores con correa mecánica", "Ventiladores eléctricos sin correa", "Ambos tipos", "Ninguno de los anteriores"], correct: 1},
  {q: "¿Cuál es la marca de la caja de cambios?", opts: ["ZF", "Allison", "Xi'an Shuangte", "Voith"], correct: 2},
  {q: "¿Cuál es el botón para cargar gas en el medidor?", opts: ["Botón rojo", "Botón PSC", "Botón amarillo", "Botón verde"], correct: 1},
  {q: "¿Qué debe hacer con las válvulas K1 cuando inicia el tanqueo de GNC?", opts: ["Cerrarlas", "Abrirlas", "Dejarlas en posición neutral", "No existen en este vehículo"], correct: 1},
  {q: "¿Cuándo debe cerrar las válvulas K1 después del tanqueo?", opts: ["Mientras está tanqueando", "ANTES de restaurar la energía eléctrica", "DESPUÉS de restaurar la energía", "No importa cuándo"], correct: 1},
  {q: "¿Cuál es el procedimiento antes de tanquear GNC?", opts: ["Solo apagar el motor", "Apagar motor + desconectar eléctricos + cortar interruptor principal", "Solo desconectar batería", "No hay procedimiento especial"], correct: 1},
  {q: "¿En qué posición debe estar la caja de cambios para arrancar?", opts: ["Posición D (Drive)", "Posición P (Park)", "Posición N (Neutral)", "Posición R (Reverse)"], correct: 2},
  {q: "¿Existe un depósito de líquido de frenos en este vehículo?", opts: ["Sí, en el motor", "Sí, bajo el piso", "No, el sistema es neumático", "No, usa aire comprimido"], correct: 2},
  {q: "¿Qué pasa si manipula mal el teclado de selección de velocidades?", opts: ["Solo suena una alarma", "Se bloquea el cambio de velocidad", "El motor se apaga", "No tiene consecuencias"], correct: 1},
  {q: "¿Cuál es el testigo que indica que hay una puerta abierta?", opts: ["Luz roja en el motor", "Símbolo de puerta abierta en el tablero", "No existe tal testigo", "Campanada sonora"], correct: 1},
  {q: "¿Para qué sirve el interruptor rojo con símbolo de bomba?", opts: ["Encender las luces", "Controlar la bomba de agua de la calefacción", "Controlar el limpiaparabrisas", "Activar el freno de motor"], correct: 1},
  {q: "¿Para qué sirve el interruptor naranja?", opts: ["Encender faros", "Controlar el desempañador de vidrios", "Activar aire acondicionado", "Controlar el ventilador del radiador"], correct: 1},
  {q: "¿Cuánto tiempo debe dejar en ralentí antes de apagar el motor?", opts: ["1 minuto", "3-5 minutos", "10 minutos", "No es necesario"], correct: 1},
  {q: "¿Por qué no debe apagar el motor inmediatamente después de trabajar a alta velocidad?", opts: ["Porque quema más gasolina", "Porque daña el turbocompresor", "Porque genera humo", "No hay razón específica"], correct: 1},
  {q: "¿Cuál es el testigo de baja presión de aceite?", opts: ["Símbolo de gota de aceite en rojo", "Símbolo de termómetro", "Símbolo de batería", "Símbolo de motor"], correct: 0},
  {q: "¿Cuál es el testigo de temperatura alta del refrigerante?", opts: ["Símbolo de termómetro en rojo", "Símbolo de gota de agua", "Símbolo de ventilador", "Símbolo de hielo"], correct: 0},
  {q: "¿Cuántos litros de ACPM consume este motor?", opts: ["20 litros", "50 litros", "100 litros", "No aplica, funciona con GNC"], correct: 3}
];

const GOOGLE_FORM = "https://docs.google.com/forms/d/e/1FAIpQLSfuK_4s0WUkwzz_fM7-nv1Aj-WAyJmybf1cWqvAOKUR-PYq5A/viewform";
const ENTRIES = {Nombre: 551624568, Cedula: 1579139034, Correo: 1453784475, Fecha: 1668362133, Hora: 1404984365, Puntaje: 267183830, Porcentaje: 741245199, Preguntas_Buenas: 128255548, Preguntas_Malas: 1989407171, Recomendacion: 30650194, P1: 409003720, P2: 1070221309, P3: 718146349, P4: 1917448372, P5: 1590847456, P6: 1863758983, P7: 1746762272, P8: 934235973, P9: 595690501, P10: 1082219796, P11: 812004237, P12: 236108679, P13: 1572096319, P14: 1395856165, P15: 1269766748, P16: 1873294745, P17: 478904272, P18: 1614892588, P19: 1022281237, P20: 1627970733};

let current = 0, answers = [], driverInfo = {};

function startQuiz(){
  const nombre = document.getElementById("nombre").value.trim();
  const cedula = document.getElementById("cedula").value.trim();
  const correo = document.getElementById("correo").value.trim();
  
  if(!nombre) { alert("Escriba el nombre."); return; }
  if(!/^[0-9]{5,15}$/.test(cedula)) { alert("La cédula debe tener solo números."); return; }
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(correo)) { alert("Correo inválido."); return; }
  
  driverInfo = {nombre, cedula, correo, fecha: new Date().toISOString().split("T")[0]};
  answers = new Array(QUESTIONS.length).fill(null);
  
  document.getElementById("formArea").style.display = "none";
  document.getElementById("quizArea").style.display = "block";
  document.getElementById("resultArea").classList.remove("show");
  
  showQuestion();
}

function showQuestion(){
  const q = QUESTIONS[current];
  let html = `<div class="question active"><div class="q-title">${current+1}. ${q.q}</div><div class="options">`;
  q.opts.forEach((opt, i) => {
    html += `<label><input type="radio" name="q" value="${i}" ${answers[current]==i?"checked":""}> ${opt}</label>`;
  });
  html += `</div></div>`;
  document.getElementById("questionContainer").innerHTML = html;
  document.getElementById("progressBar").style.width = ((current+1)/QUESTIONS.length*100) + "%";
  document.getElementById("nextBtn").textContent = current == QUESTIONS.length-1 ? "Terminar" : "Siguiente →";
}

function nextQuestion(){
  const selected = document.querySelector("input[name='q']:checked");
  if(selected) answers[current] = parseInt(selected.value);
  
  current++;
  if(current < QUESTIONS.length) {
    showQuestion();
  } else {
    showResults();
  }
}

function showResults(){
  const buenas = answers.filter((a, i) => a === QUESTIONS[i].correct).length;
  const pct = Math.round(buenas / QUESTIONS.length * 100);
  const rec = pct >= 70 ? "Apto. Puede manejar el vehículo." : "No aprobado. Requiere capacitación adicional.";
  
  document.getElementById("quizArea").style.display = "none";
  document.getElementById("resultArea").classList.add("show");
  document.getElementById("scoreDisplay").textContent = buenas + "/20";
  document.getElementById("percentDisplay").textContent = pct + "% de respuestas correctas";
  document.getElementById("userInfo").innerHTML = `${driverInfo.nombre} · CC ${driverInfo.cedula} · ${driverInfo.fecha}`;
  document.getElementById("recDisplay").innerHTML = `<strong>Recomendación:</strong> ${rec}`;
  
  window.resultData = {buenas, pct, rec, answers};
}

function saveToGoogle(){
  const data = window.resultData;
  const buenas = [], malas = [];
  answers.forEach((a, i) => { if(a === QUESTIONS[i].correct) buenas.push(i+1); else malas.push(i+1); });
  
  const params = new URLSearchParams();
  params.set("entry." + ENTRIES.Nombre, driverInfo.nombre);
  params.set("entry." + ENTRIES.Cedula, driverInfo.cedula);
  params.set("entry." + ENTRIES.Correo, driverInfo.correo);
  params.set("entry." + ENTRIES.Fecha, driverInfo.fecha);
  params.set("entry." + ENTRIES.Hora, new Date().toLocaleTimeString());
  params.set("entry." + ENTRIES.Puntaje, data.buenas + "/20");
  params.set("entry." + ENTRIES.Porcentaje, data.pct + "%");
  params.set("entry." + ENTRIES.Preguntas_Buenas, buenas.join(", "));
  params.set("entry." + ENTRIES.Preguntas_Malas, malas.join(", "));
  params.set("entry." + ENTRIES.Recomendacion, data.rec);
  
  Object.keys(ENTRIES).slice(10).forEach((key, i) => {
    const respuesta = answers[i] !== null ? QUESTIONS[i].opts[answers[i]] : "";
    params.set("entry." + ENTRIES[key], respuesta);
  });
  
  window.open(GOOGLE_FORM + "?" + params.toString(), "_blank");
}
</script>

</body>
</html>
